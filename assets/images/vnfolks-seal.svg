<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <!-- Ancient Vietnamese Imperial / Folk Vermilion Seal -->
  <rect x="15" y="15" width="170" height="170" rx="16" fill="#743014" stroke="#E8D1A7" stroke-width="4"/>
  <rect x="25" y="25" width="150" height="150" rx="10" fill="none" stroke="#E8D1A7" stroke-width="1.5" stroke-dasharray="6 3"/>
  <!-- Central Dong Son Starburst -->
  <g transform="translate(100, 100)" fill="#E8D1A7">
    <circle cx="0" cy="0" r="10"/>
    <polygon points="0,-28 3,-12 -3,-12"/>
    <polygon points="0,28 3,12 -3,12"/>
    <polygon points="-28,0 -12,3 -12,-3"/>
    <polygon points="28,0 12,3 12,-3"/>
    <polygon points="20,20 9,6 6,9"/>
    <polygon points="-20,-20 -9,-6 -6,-9"/>
    <polygon points="20,-20 9,-6 6,-9"/>
    <polygon points="-20,20 -9,6 -6,9"/>
  </g>
  <text x="100" y="58" font-family="'Cinzel Decorative', 'Georgia', serif" font-size="16" letter-spacing="3" fill="#E8D1A7" text-anchor="middle" font-weight="bold">VN</text>
  <text x="100" y="160" font-family="'Cinzel Decorative', 'Georgia', serif" font-size="15" letter-spacing="3" fill="#E8D1A7" text-anchor="middle" font-weight="bold">FOLKS</text>
</svg>
