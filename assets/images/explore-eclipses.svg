<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <radialGradient id="eclipseGlow" cx="45%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#E8D1A7" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#743014" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#1b110b" stop-opacity="0.95"/>
    </radialGradient>
    <radialGradient id="sunCorona" cx="50%" cy="50%" r="50%">
      <stop offset="70%" stop-color="#E8D1A7" stop-opacity="0.9"/>
      <stop offset="85%" stop-color="#84592B" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#743014" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="celestialShadow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#120904"/>
      <stop offset="100%" stop-color="#2a1309"/>
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="500" fill="#1b110b"/>
  <rect width="800" height="500" fill="url(#eclipseGlow)"/>

  <!-- Vintage border frame -->
  <rect x="20" y="20" width="760" height="460" fill="none" stroke="#9D9167" stroke-width="1.5" stroke-dasharray="8 4" opacity="0.6"/>
  <rect x="28" y="28" width="744" height="444" fill="none" stroke="#84592B" stroke-width="0.8" opacity="0.8"/>

  <!-- Corner Ornaments -->
  <g stroke="#E8D1A7" stroke-width="1.2" fill="none" opacity="0.7">
    <path d="M 28 48 L 48 48 L 48 28"/>
    <path d="M 772 48 L 752 48 L 752 28"/>
    <path d="M 28 452 L 48 452 L 48 472"/>
    <path d="M 772 452 L 752 452 L 752 472"/>
    <circle cx="48" cy="48" r="3" fill="#E8D1A7"/>
    <circle cx="752" cy="48" r="3" fill="#E8D1A7"/>
    <circle cx="48" cy="452" r="3" fill="#E8D1A7"/>
    <circle cx="752" cy="452" r="3" fill="#E8D1A7"/>
  </g>

  <!-- Celestial Constellation Grid / Ancient Astrolabe Rings -->
  <g stroke="#84592B" stroke-width="0.8" fill="none" opacity="0.45">
    <circle cx="400" cy="220" r="180" stroke-dasharray="3 6"/>
    <circle cx="400" cy="220" r="140"/>
    <circle cx="400" cy="220" r="100" stroke-dasharray="2 4"/>
    <line x1="200" y1="220" x2="600" y2="220"/>
    <line x1="400" y1="40" x2="400" y2="400"/>
  </g>

  <!-- The Eclipsed Sun / Blood Moon Corona -->
  <g>
    <!-- Corona Rays -->
    <circle cx="400" cy="220" r="95" fill="url(#sunCorona)"/>
    
    <!-- Outer Crimson Ring of Rayleigh Scattering -->
    <circle cx="400" cy="220" r="82" fill="none" stroke="#743014" stroke-width="4" opacity="0.8"/>
    <circle cx="400" cy="220" r="80" fill="#743014" opacity="0.3"/>

    <!-- The Lunar / Umbral Disc Swallowing the Luminary -->
    <circle cx="388" cy="214" r="76" fill="url(#celestialShadow)"/>
    <!-- Diamond Ring Flare effect -->
    <circle cx="462" cy="180" r="8" fill="#E8D1A7"/>
    <polygon points="462,160 465,178 480,180 465,182 462,200 459,182 444,180 459,178" fill="#E8D1A7" opacity="0.9"/>
  </g>

  <!-- Mythological Celestial Devourer Silhouette (The Heavenly Toad / Celestial Beast) -->
  <g opacity="0.8">
    <!-- Massive jaw curving over the moon disc -->
    <path d="M 230 110 Q 320 90 390 135 Q 350 160 300 165 Q 240 180 200 230 Z" fill="#140b06" stroke="#84592B" stroke-width="1.2"/>
    <!-- Lower jaw -->
    <path d="M 220 270 Q 280 260 330 240 Q 300 285 240 310 Z" fill="#140b06" stroke="#84592B" stroke-width="1.2"/>
    <!-- Beast eye glowing -->
    <circle cx="270" cy="125" r="4.5" fill="#E8D1A7"/>
    <!-- Scales / Traditional cloud swirls (mây cổ) -->
    <path d="M 180 150 Q 200 130 220 160 Q 240 140 260 170" stroke="#9D9167" stroke-width="1" fill="none" opacity="0.6"/>
    <path d="M 160 220 Q 190 200 210 230" stroke="#9D9167" stroke-width="1" fill="none" opacity="0.6"/>
  </g>

  <!-- Earthly Village Silhouette Banging Brass Mortars Below -->
  <g opacity="0.9">
    <!-- Village thatched roofs and banyan tree silhouette -->
    <path d="M 40 430 L 120 400 L 200 430 L 280 390 L 360 430 L 440 405 L 530 430 L 620 395 L 720 430 L 760 420 L 760 480 L 40 480 Z" fill="#0c0704"/>
    
    <!-- Villagers raising pestles to beat drums (gõ cối vang trời) -->
    <!-- Figure 1 -->
    <ellipse cx="250" cy="405" rx="5" ry="5" fill="#84592B"/>
    <line x1="250" y1="410" x2="250" y2="430" stroke="#84592B" stroke-width="3"/>
    <line x1="250" y1="415" x2="260" y2="395" stroke="#E8D1A7" stroke-width="2"/> <!-- pestle -->
    <!-- Mortar vessel -->
    <path d="M 260 420 L 275 420 L 270 432 L 265 432 Z" fill="#9D9167"/>

    <!-- Figure 2 with Gong -->
    <ellipse cx="510" cy="400" rx="5" ry="5" fill="#84592B"/>
    <line x1="510" y1="405" x2="510" y2="425" stroke="#84592B" stroke-width="3"/>
    <circle cx="525" cy="405" r="9" fill="none" stroke="#E8D1A7" stroke-width="2"/> <!-- brass gong -->
    <line x1="510" y1="408" x2="524" y2="405" stroke="#84592B" stroke-width="2"/>
  </g>

  <!-- Ancient Seal -->
  <g transform="translate(60, 60)">
    <circle cx="35" cy="35" r="28" fill="#743014" stroke="#E8D1A7" stroke-width="1.5"/>
    <text x="35" y="32" font-family="'Cinzel Decorative', 'Georgia', serif" font-size="10" fill="#E8D1A7" text-anchor="middle" font-weight="bold">NHẬT</text>
    <text x="35" y="47" font-family="'Cinzel Decorative', 'Georgia', serif" font-size="10" fill="#E8D1A7" text-anchor="middle" font-weight="bold">THỰC</text>
  </g>

  <!-- Label in Antique Serif -->
  <text x="400" y="460" font-family="'Cinzel Decorative', 'Georgia', serif" font-size="14" letter-spacing="4" fill="#E8D1A7" text-anchor="middle" opacity="0.85">COSMIC DEVOURER &amp; ORBITAL SYZYGY</text>
</svg>
