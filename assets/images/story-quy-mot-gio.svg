<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <radialGradient id="coastBg" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#84592B" stop-opacity="0.3"/>
      <stop offset="55%" stop-color="#3d2112" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#120a06" stop-opacity="0.95"/>
    </radialGradient>
  </defs>
  <rect width="600" height="400" fill="#120a06"/>
  <rect width="600" height="400" fill="url(#coastBg)"/>

  <rect x="15" y="15" width="570" height="370" fill="none" stroke="#9D9167" stroke-width="1.2" stroke-dasharray="6 3" opacity="0.6"/>
  <rect x="22" y="22" width="556" height="356" fill="none" stroke="#84592B" stroke-width="0.8" opacity="0.8"/>

  <!-- Coastal Granite Crags of Sầm Sơn (Núi Cổ Giải / Bờ Biển Sầm Sơn) -->
  <g fill="#25160d" stroke="#442D1C" stroke-width="1.2" opacity="0.85">
    <!-- Mountain Cliff on the Right -->
    <path d="M 380 380 L 390 260 L 440 220 L 490 280 L 570 240 L 570 380 Z"/>
    <!-- Crashing Sea Waves on the Left (Sóng Biển) -->
    <path d="M 30 380 Q 90 320 150 350 Q 210 320 280 360 Q 330 340 380 380 Z" fill="#1b2520"/>
    <path d="M 60 360 Q 110 330 160 350" stroke="#E8D1A7" stroke-width="1" fill="none" opacity="0.6"/>
    <path d="M 170 340 Q 220 320 270 340" stroke="#E8D1A7" stroke-width="1" fill="none" opacity="0.6"/>
  </g>

  <!-- Thần Độc Cước / Giant One-Legged Hero Silhouette -->
  <g transform="translate(250, 70)" opacity="0.92">
    <!-- Colossal Cleaving Battle Axe (Búa Khổng Lồ Chém Đôi) Raised High -->
    <g transform="translate(70, 20)">
      <!-- Long axe haft -->
      <line x1="-30" y1="120" x2="60" y2="-10" stroke="#84592B" stroke-width="4.5"/>
      <!-- Giant Crescent Bronze Axe Blade -->
      <path d="M 50 -30 Q 90 0 70 30 Q 35 15 50 -30 Z" fill="#9D9167" stroke="#E8D1A7" stroke-width="1.5"/>
      <!-- Dong Son spiral motif on blade -->
      <circle cx="58" cy="2" r="4" fill="none" stroke="#743014" stroke-width="1"/>
    </g>

    <!-- The Half-Body Guardian Figure (Một Nửa Thân Mình / Một Chân) -->
    <!-- Head in profile / helmet crown -->
    <path d="M 30 40 Q 50 25 55 50 L 30 65 Z" fill="#1b110a" stroke="#84592B" stroke-width="1.2"/>
    <polygon points="50,25 60,10 52,30" fill="#E8D1A7"/> <!-- Feather plume crown -->
    
    <!-- Muscular Half Torso -->
    <path d="M 15 65 L 55 65 L 45 170 L 25 170 Z" fill="#25160d" stroke="#84592B" stroke-width="1.5"/>
    
    <!-- Single Mighty Arm Gripping Axe -->
    <path d="M 45 75 Q 85 70 95 40" stroke="#25160d" stroke-width="10" stroke-linecap="round" fill="none"/>
    <path d="M 45 75 Q 85 70 95 40" stroke="#84592B" stroke-width="2" fill="none"/>

    <!-- Single Pillar-Like Leg Standing Firmly on Granite Rock -->
    <rect x="25" y="170" width="22" height="100" fill="#1b110a" stroke="#84592B" stroke-width="1.5"/>
    <!-- Giant Single Foot Planted on Mountain -->
    <path d="M 20 270 L 60 270 L 55 255 L 20 255 Z" fill="#84592B"/>
  </g>

  <!-- Dividing Line of Light (Symbolizing the self-sacrifice split) -->
  <line x1="265" y1="40" x2="265" y2="340" stroke="#E8D1A7" stroke-width="1.2" stroke-dasharray="4 6" opacity="0.5"/>

  <!-- Tag Seal -->
  <g transform="translate(45, 45)">
    <circle cx="20" cy="20" r="18" fill="#743014" stroke="#E8D1A7" stroke-width="1"/>
    <text x="20" y="24" font-family="'Cinzel Decorative', serif" font-size="9" fill="#E8D1A7" text-anchor="middle">IX</text>
  </g>

  <text x="300" y="370" font-family="'Cinzel Decorative', 'Georgia', serif" font-size="13" letter-spacing="2.5" fill="#E8D1A7" text-anchor="middle">QUỶ MỘT GIÒ / THẦN ĐỘC CƯỚC</text>
</svg>
