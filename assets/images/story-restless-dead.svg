<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <radialGradient id="tombBg" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#442D1C" stop-opacity="0.4"/>
      <stop offset="60%" stop-color="#2a180f" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#110905" stop-opacity="0.95"/>
    </radialGradient>
  </defs>
  <rect width="600" height="400" fill="#110905"/>
  <rect width="600" height="400" fill="url(#tombBg)"/>

  <rect x="15" y="15" width="570" height="370" fill="none" stroke="#9D9167" stroke-width="1.2" stroke-dasharray="6 3" opacity="0.6"/>
  <rect x="22" y="22" width="556" height="356" fill="none" stroke="#84592B" stroke-width="0.8" opacity="0.8"/>

  <!-- Ancient Moss-Covered Brick Tomb & Weathered Burial Stele (Mộ Cổ) -->
  <g transform="translate(180, 150)">
    <!-- Stele Base -->
    <rect x="50" y="150" width="140" height="20" fill="#2d1c12" stroke="#84592B" stroke-width="1.2"/>
    <!-- Upright Stele Slab -->
    <path d="M 65 150 L 65 40 Q 120 15 175 40 L 175 150 Z" fill="#352216" stroke="#84592B" stroke-width="1.5"/>
    
    <!-- Faded Ancient Inscriptions on Stone -->
    <line x1="120" y1="50" x2="120" y2="135" stroke="#9D9167" stroke-width="2" stroke-dasharray="8 6" opacity="0.7"/>
    <line x1="95" y1="65" x2="95" y2="125" stroke="#9D9167" stroke-width="1.5" stroke-dasharray="5 5" opacity="0.5"/>
    <line x1="145" y1="65" x2="145" y2="125" stroke="#9D9167" stroke-width="1.5" stroke-dasharray="5 5" opacity="0.5"/>

    <!-- Crack across tombstone indicating disturbed rest -->
    <path d="M 125 45 L 140 70 L 130 95 L 150 130" stroke="#110905" stroke-width="1.5" fill="none"/>
  </g>

  <!-- Wandering Spectral Figure Emerging from Mist (Linh hồn bất an) -->
  <g opacity="0.75" transform="translate(240, 110)">
    <path d="M 60 170 Q 50 110 60 80 Q 70 50 60 30 Q 50 50 55 80 Q 40 120 20 170 Z" fill="#1b120c"/>
    <!-- Swirling mist bands -->
    <path d="M -50 160 Q 30 140 120 165 Q 200 180 260 155" stroke="#9D9167" stroke-width="1.2" fill="none" opacity="0.4"/>
  </g>

  <!-- Paper Votive Talisman (Lá Bùa Phong Ấn) Fluttering on Tree Branch -->
  <g transform="translate(420, 100)">
    <rect x="0" y="0" width="28" height="65" fill="#84592B" stroke="#E8D1A7" stroke-width="1" opacity="0.85"/>
    <!-- Red vermilion talisman characters (Chữ Bùa Đỏ) -->
    <path d="M 14 8 L 14 55 M 6 20 L 22 20 M 8 35 L 20 35" stroke="#743014" stroke-width="2"/>
  </g>

  <!-- Tag Seal -->
  <g transform="translate(45, 45)">
    <circle cx="20" cy="20" r="18" fill="#743014" stroke="#E8D1A7" stroke-width="1"/>
    <text x="20" y="24" font-family="'Cinzel Decorative', serif" font-size="10" fill="#E8D1A7" text-anchor="middle">IV</text>
  </g>

  <text x="300" y="370" font-family="'Cinzel Decorative', 'Georgia', serif" font-size="12" letter-spacing="2.5" fill="#E8D1A7" text-anchor="middle">THE RESTLESS DEAD &amp; UNQUIET GRAVES</text>
</svg>
