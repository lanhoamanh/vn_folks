<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <radialGradient id="xoBg" cx="30%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#84592B" stop-opacity="0.3"/>
      <stop offset="60%" stop-color="#2a180f" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0e0704" stop-opacity="0.95"/>
    </radialGradient>
  </defs>
  <rect width="600" height="400" fill="#0e0704"/>
  <rect width="600" height="400" fill="url(#xoBg)"/>

  <rect x="15" y="15" width="570" height="370" fill="none" stroke="#9D9167" stroke-width="1.2" stroke-dasharray="6 3" opacity="0.6"/>
  <rect x="22" y="22" width="556" height="356" fill="none" stroke="#84592B" stroke-width="0.8" opacity="0.8"/>

  <!-- Dark Corner of Stilt House (Góc Nhà Sàn / Cột Gỗ) -->
  <g stroke="#3d2719" stroke-width="3" opacity="0.85">
    <!-- Heavy wooden corner support pillar -->
    <rect x="120" y="20" width="35" height="360" fill="#25160d" stroke="#442D1C" stroke-width="2"/>
    <!-- Cross beams intersecting at corner -->
    <line x1="20" y1="90" x2="580" y2="90"/>
    <line x1="120" y1="310" x2="580" y2="310"/>
  </g>

  <!-- Woven Bamboo Matting on Walls (Vách Nứa / Tre Đan) -->
  <g stroke="#84592B" stroke-width="0.8" opacity="0.3">
    <line x1="155" y1="100" x2="350" y2="100"/>
    <line x1="155" y1="130" x2="350" y2="130"/>
    <line x1="155" y1="160" x2="350" y2="160"/>
    <line x1="155" y1="190" x2="350" y2="190"/>
    <line x1="155" y1="220" x2="350" y2="220"/>
    <line x1="155" y1="250" x2="350" y2="250"/>
    <line x1="155" y1="280" x2="350" y2="280"/>
  </g>

  <!-- Hidden Corner Altar Shelf (Bàn Thờ Ma Xó Bí Ẩn) -->
  <g transform="translate(190, 140)">
    <!-- Small rustic wooden corner shelf -->
    <polygon points="0,90 120,50 120,65 0,105" fill="#351f12" stroke="#84592B" stroke-width="1.2"/>

    <!-- Guardian Totem / Skull Relic Enshrined in Darkness -->
    <g transform="translate(45, 10)">
      <!-- Cranium contour -->
      <path d="M 10 35 C 5 15 25 5 45 5 C 65 5 85 15 80 35 C 80 50 70 65 65 70 L 25 70 C 20 65 10 50 10 35 Z" fill="#E8D1A7" opacity="0.75" stroke="#84592B" stroke-width="1"/>
      <!-- Eye Sockets -->
      <ellipse cx="30" cy="38" rx="8" ry="10" fill="#140a05"/>
      <ellipse cx="60" cy="38" rx="8" ry="10" fill="#140a05"/>
      <!-- Glowing pinpoint spirit eyes inside sockets -->
      <circle cx="30" cy="38" r="1.8" fill="#743014"/>
      <circle cx="60" cy="38" r="1.8" fill="#743014"/>
      <!-- Nasal cavity & Teeth -->
      <polygon points="45,46 41,56 49,56" fill="#140a05"/>
      <line x1="32" y1="64" x2="58" y2="64" stroke="#140a05" stroke-width="1.5"/>
      <line x1="36" y1="60" x2="36" y2="68" stroke="#140a05" stroke-width="1"/>
      <line x1="44" y1="60" x2="44" y2="68" stroke="#140a05" stroke-width="1"/>
      <line x1="52" y1="60" x2="52" y2="68" stroke="#140a05" stroke-width="1"/>
    </g>

    <!-- Small Wine Cup Offering (Chén rượu) & Betel Nut -->
    <path d="M 15 85 L 18 97 L 27 97 L 30 85 Z" fill="#9D9167" stroke="#E8D1A7" stroke-width="0.8"/>
    <circle cx="38" cy="94" r="4" fill="#743014"/> <!-- betel leaf/nut -->

    <!-- Single Smoldering Incense Stick -->
    <line x1="5" y1="95" x2="-8" y2="30" stroke="#743014" stroke-width="1.5"/>
    <circle cx="-8" cy="30" r="1.5" fill="#E8D1A7"/>
  </g>

  <!-- Tag Seal -->
  <g transform="translate(45, 45)">
    <circle cx="20" cy="20" r="18" fill="#743014" stroke="#E8D1A7" stroke-width="1"/>
    <text x="20" y="24" font-family="'Cinzel Decorative', serif" font-size="10" fill="#E8D1A7" text-anchor="middle">VI</text>
  </g>

  <text x="300" y="370" font-family="'Cinzel Decorative', 'Georgia', serif" font-size="13" letter-spacing="3" fill="#E8D1A7" text-anchor="middle">MA XÓ — CORNER GUARDIAN SPIRIT</text>
</svg>
