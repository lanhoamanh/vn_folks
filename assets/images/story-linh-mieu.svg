<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <radialGradient id="catGlow" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#84592B" stop-opacity="0.3"/>
      <stop offset="60%" stop-color="#3b1f14" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#0c0704" stop-opacity="0.95"/>
    </radialGradient>
  </defs>
  <rect width="600" height="400" fill="#0c0704"/>
  <rect width="600" height="400" fill="url(#catGlow)"/>

  <rect x="15" y="15" width="570" height="370" fill="none" stroke="#9D9167" stroke-width="1.2" stroke-dasharray="6 3" opacity="0.6"/>
  <rect x="22" y="22" width="556" height="356" fill="none" stroke="#84592B" stroke-width="0.8" opacity="0.8"/>

  <!-- Ancient Carved Wooden Casket Lid (Nắp Quan Tài Gỗ) -->
  <g transform="translate(140, 260)">
    <!-- Wooden Coffin Top Edge -->
    <rect x="20" y="20" width="300" height="30" fill="#2d1c12" stroke="#84592B" stroke-width="1.5"/>
    <!-- Traditional Lotus Carving Relief (Chạm Khắc Hoa Sen) -->
    <path d="M 170 35 C 160 25 150 25 140 35 C 150 45 160 45 170 35 Z" fill="#84592B" opacity="0.8"/>
    <line x1="30" y1="35" x2="130" y2="35" stroke="#9D9167" stroke-width="1" stroke-dasharray="8 4" opacity="0.6"/>
    <line x1="180" y1="35" x2="310" y2="35" stroke="#9D9167" stroke-width="1" stroke-dasharray="8 4" opacity="0.6"/>
  </g>

  <!-- The Mystic Black Cat (Linh Miêu) Crouched on Casket -->
  <g transform="translate(220, 110)">
    <!-- Sleek Obsidian Feline Body -->
    <path d="M 50 170 C 40 120 70 80 110 80 C 145 80 170 110 165 170 Z" fill="#080402" stroke="#442D1C" stroke-width="1.2"/>
    
    <!-- Slender Forepaws on Coffin Edge -->
    <rect x="75" y="150" width="12" height="25" rx="5" fill="#080402"/>
    <rect x="125" y="150" width="12" height="25" rx="5" fill="#080402"/>

    <!-- Feline Head -->
    <ellipse cx="105" cy="65" rx="28" ry="24" fill="#080402"/>
    
    <!-- Sharp Pointed Ears with Inner Warm Tint -->
    <polygon points="80,55 85,25 100,50" fill="#080402"/>
    <polygon points="83,50 86,30 96,48" fill="#743014"/>
    <polygon points="110,50 125,25 130,55" fill="#080402"/>
    <polygon points="114,48 124,30 127,50" fill="#743014"/>

    <!-- Piercing Amber / Golden Feline Eyes (Mắt Vàng Hổ Phách) -->
    <ellipse cx="94" cy="62" rx="7" ry="5.5" fill="#E8D1A7"/>
    <ellipse cx="118" cy="62" rx="7" ry="5.5" fill="#E8D1A7"/>
    <!-- Vertical Slit Pupils -->
    <ellipse cx="94" cy="62" rx="1.5" ry="5" fill="#140a05"/>
    <ellipse cx="118" cy="62" rx="1.5" ry="5" fill="#140a05"/>

    <!-- Mythic "Third Eye" / Golden Tuft on Forehead (Chỏm Lông Mắt Thứ Ba) -->
    <circle cx="106" cy="48" r="3.5" fill="#E8D1A7"/>
    <polygon points="106,42 108,47 113,48 108,49 106,54 104,49 99,48 104,47" fill="#E8D1A7"/>

    <!-- Long Sinister Tail Arching Behind -->
    <path d="M 160 150 Q 200 130 190 90 Q 180 60 160 70" stroke="#080402" stroke-width="6" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Static Electric Sparks / Faint Bio-Aura (Luồng Điện Cảm Ứng) -->
  <g stroke="#E8D1A7" stroke-width="1" opacity="0.65">
    <path d="M 280 200 L 285 208 L 292 208 L 298 218"/>
    <path d="M 360 210 L 355 220 L 348 220 L 344 230"/>
    <circle cx="280" cy="200" r="1.5" fill="#E8D1A7"/>
    <circle cx="360" cy="210" r="1.5" fill="#E8D1A7"/>
  </g>

  <!-- Tag Seal -->
  <g transform="translate(45, 45)">
    <circle cx="20" cy="20" r="18" fill="#743014" stroke="#E8D1A7" stroke-width="1"/>
    <text x="20" y="24" font-family="'Cinzel Decorative', serif" font-size="9" fill="#E8D1A7" text-anchor="middle">VIII</text>
  </g>

  <text x="300" y="370" font-family="'Cinzel Decorative', 'Georgia', serif" font-size="13" letter-spacing="3" fill="#E8D1A7" text-anchor="middle">LINH MIÊU — THE MYSTIC BLACK CAT</text>
</svg>
