<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <radialGradient id="ghostGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#E8D1A7" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#743014" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#19110d" stop-opacity="0.95"/>
    </radialGradient>
    <linearGradient id="incenseSmoke" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#E8D1A7" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#9D9167" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#E8D1A7" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="#19110d"/>
  <rect width="800" height="500" fill="url(#ghostGlow)"/>

  <!-- Vintage border frame -->
  <rect x="20" y="20" width="760" height="460" fill="none" stroke="#9D9167" stroke-width="1.5" stroke-dasharray="8 4" opacity="0.6"/>
  <rect x="28" y="28" width="744" height="444" fill="none" stroke="#84592B" stroke-width="0.8" opacity="0.8"/>

  <!-- Corner Ornaments -->
  <g stroke="#E8D1A7" stroke-width="1.2" fill="none" opacity="0.7">
    <path d="M 28 48 L 48 48 L 48 28"/>
    <path d="M 772 48 L 752 48 L 752 28"/>
    <path d="M 28 452 L 48 452 L 48 472"/>
    <path d="M 772 452 L 752 452 L 752 472"/>
    <circle cx="48" cy="48" r="3" fill="#E8D1A7"/>
    <circle cx="752" cy="48" r="3" fill="#E8D1A7"/>
    <circle cx="48" cy="452" r="3" fill="#E8D1A7"/>
    <circle cx="752" cy="452" r="3" fill="#E8D1A7"/>
  </g>

  <!-- River of Souls / Water Ripples with Floating Paper Lotus Lanterns (Hoa Đăng) -->
  <g opacity="0.8">
    <path d="M 40 370 Q 200 350 400 365 Q 600 380 760 360 L 760 480 L 40 480 Z" fill="#110b07"/>
    <path d="M 60 410 Q 250 400 450 415 Q 650 425 740 410" stroke="#84592B" stroke-width="1" fill="none" opacity="0.5"/>
    <path d="M 120 440 Q 300 435 500 445 Q 680 450 720 440" stroke="#84592B" stroke-width="1" fill="none" opacity="0.4"/>

    <!-- Floating Lotus Lantern 1 -->
    <g transform="translate(180, 390)">
      <path d="M 0 15 Q 15 -10 30 15 Z" fill="#743014" stroke="#E8D1A7" stroke-width="0.8"/>
      <path d="M 10 15 Q 25 -15 40 15 Z" fill="#84592B" stroke="#E8D1A7" stroke-width="0.8"/>
      <circle cx="20" cy="5" r="4" fill="#E8D1A7"/> <!-- candle flame -->
    </g>

    <!-- Floating Lotus Lantern 2 -->
    <g transform="translate(560, 400) scale(0.8)">
      <path d="M 0 15 Q 15 -10 30 15 Z" fill="#743014" stroke="#E8D1A7" stroke-width="0.8"/>
      <circle cx="15" cy="5" r="4" fill="#E8D1A7"/>
    </g>
  </g>

  <!-- Roadside Offering Altar (Mâm Cúng Thí Thực / Xá Tội Vong Nhân) -->
  <g transform="translate(280, 240)">
    <!-- Wooden Table / Altar Stand -->
    <rect x="20" y="70" width="200" height="15" fill="#442D1C" stroke="#84592B" stroke-width="1.5"/>
    <rect x="35" y="85" width="12" height="50" fill="#351f11"/>
    <rect x="195" y="85" width="12" height="50" fill="#351f11"/>

    <!-- Incense Burner (Bát Hương) with Three Red Incense Sticks & Smoke -->
    <path d="M 105 70 L 110 50 L 130 50 L 135 70 Z" fill="#84592B" stroke="#E8D1A7" stroke-width="1"/>
    <!-- Three incense sticks -->
    <line x1="116" y1="50" x2="114" y2="10" stroke="#743014" stroke-width="2"/>
    <line x1="120" y1="50" x2="120" y2="5" stroke="#743014" stroke-width="2"/>
    <line x1="124" y1="50" x2="126" y2="10" stroke="#743014" stroke-width="2"/>
    <!-- Glowing tips -->
    <circle cx="114" cy="10" r="1.5" fill="#E8D1A7"/>
    <circle cx="120" cy="5" r="1.5" fill="#E8D1A7"/>
    <circle cx="126" cy="10" r="1.5" fill="#E8D1A7"/>

    <!-- Incense Smoke Curling Upward into Sky -->
    <path d="M 120 5 Q 110 -30 135 -60 Q 160 -90 130 -130 Q 110 -170 140 -200" 
          stroke="url(#incenseSmoke)" stroke-width="2.5" fill="none" opacity="0.8"/>
    <path d="M 122 5 Q 135 -35 115 -70 Q 95 -100 120 -140" 
          stroke="url(#incenseSmoke)" stroke-width="1.8" fill="none" opacity="0.6"/>

    <!-- Small Bowls of Thin Rice Porridge (Cháo Loãng) -->
    <ellipse cx="60" cy="67" rx="14" ry="6" fill="#9D9167" stroke="#E8D1A7" stroke-width="0.8"/>
    <ellipse cx="180" cy="67" rx="14" ry="6" fill="#9D9167" stroke="#E8D1A7" stroke-width="0.8"/>
    <!-- Votive Paper Ingot / Coins -->
    <polygon points="85,68 95,62 100,68" fill="#E8D1A7" stroke="#84592B" stroke-width="0.5"/>
  </g>

  <!-- Spectral Wandering Shadows in the Mist (Cô Hồn) -->
  <g opacity="0.55">
    <!-- Ethereal Figure 1 -->
    <path d="M 140 180 Q 130 130 150 110 Q 170 130 160 180 Q 170 230 130 260 Z" fill="#2d1c14"/>
    <circle cx="150" cy="100" r="12" fill="#2d1c14"/>
    <!-- Ethereal Figure 2 -->
    <path d="M 640 170 Q 630 120 650 100 Q 670 120 660 170 Q 670 220 630 250 Z" fill="#2d1c14"/>
    <circle cx="650" cy="90" r="11" fill="#2d1c14"/>
  </g>

  <!-- Seal -->
  <g transform="translate(60, 60)">
    <circle cx="35" cy="35" r="28" fill="#743014" stroke="#E8D1A7" stroke-width="1.5"/>
    <text x="35" y="32" font-family="'Cinzel Decorative', 'Georgia', serif" font-size="10" fill="#E8D1A7" text-anchor="middle" font-weight="bold">CÔ</text>
    <text x="35" y="47" font-family="'Cinzel Decorative', 'Georgia', serif" font-size="10" fill="#E8D1A7" text-anchor="middle" font-weight="bold">HỒN</text>
  </g>

  <!-- Label in Antique Serif -->
  <text x="400" y="460" font-family="'Cinzel Decorative', 'Georgia', serif" font-size="14" letter-spacing="4" fill="#E8D1A7" text-anchor="middle" opacity="0.85">GHOST MONTH &amp; COLLECTIVE REMEMBRANCE</text>
</svg>
