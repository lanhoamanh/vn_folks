<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <radialGradient id="forestGlow" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#E8D1A7" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#84592B" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#141810" stop-opacity="0.95"/>
    </radialGradient>
    <radialGradient id="moonSoft" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E8D1A7" stop-opacity="0.9"/>
      <stop offset="80%" stop-color="#9D9167" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#141810" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="500" fill="#141810"/>
  <rect width="800" height="500" fill="url(#forestGlow)"/>

  <!-- Vintage border frame -->
  <rect x="20" y="20" width="760" height="460" fill="none" stroke="#9D9167" stroke-width="1.5" stroke-dasharray="8 4" opacity="0.6"/>
  <rect x="28" y="28" width="744" height="444" fill="none" stroke="#84592B" stroke-width="0.8" opacity="0.8"/>

  <!-- Corner Ornaments -->
  <g stroke="#E8D1A7" stroke-width="1.2" fill="none" opacity="0.7">
    <path d="M 28 48 L 48 48 L 48 28"/>
    <path d="M 772 48 L 752 48 L 752 28"/>
    <path d="M 28 452 L 48 452 L 48 472"/>
    <path d="M 772 452 L 752 452 L 752 472"/>
    <circle cx="48" cy="48" r="3" fill="#E8D1A7"/>
    <circle cx="752" cy="48" r="3" fill="#E8D1A7"/>
    <circle cx="48" cy="452" r="3" fill="#E8D1A7"/>
    <circle cx="752" cy="452" r="3" fill="#E8D1A7"/>
  </g>

  <!-- Large Foggy Full Moon -->
  <circle cx="480" cy="180" r="110" fill="url(#moonSoft)"/>
  <circle cx="480" cy="180" r="65" fill="#E8D1A7" opacity="0.6"/>

  <!-- Ancient Gnarly Banyan / Fig Tree Branch (Cây Đa / Cây Đề) -->
  <g fill="#211a12" stroke="#442D1C" stroke-width="1.5">
    <!-- Main heavy branch extending from left -->
    <path d="M 30 380 Q 180 340 320 280 Q 420 240 580 230 Q 640 230 720 270 L 730 290 Q 620 250 430 260 Q 280 320 30 420 Z"/>
    <!-- Hanging aerial roots (rễ đa rủ) -->
    <path d="M 220 320 Q 210 400 200 450" stroke="#352417" stroke-width="2.5" fill="none"/>
    <path d="M 340 280 Q 330 380 325 440" stroke="#352417" stroke-width="2" fill="none"/>
    <path d="M 450 255 Q 460 350 470 410" stroke="#352417" stroke-width="1.8" fill="none"/>
  </g>

  <!-- The Barn Owl (Chim Lợn / Cú Mèo) Perched on Branch -->
  <g transform="translate(360, 140)">
    <!-- Owl Body -->
    <ellipse cx="60" cy="90" rx="32" ry="46" fill="#1b1510" stroke="#84592B" stroke-width="1.2"/>
    <!-- Heart-shaped facial disc characteristic of Tyto alba -->
    <path d="M 45 45 C 32 30 42 20 60 30 C 78 20 88 30 75 45 C 68 55 60 62 60 62 C 60 62 52 55 45 45 Z" fill="#E8D1A7" stroke="#84592B" stroke-width="1"/>
    <!-- Dark nocturnal eyes -->
    <circle cx="52" cy="38" r="4.5" fill="#1a110a"/>
    <circle cx="68" cy="38" r="4.5" fill="#1a110a"/>
    <circle cx="51" cy="37" r="1.5" fill="#E8D1A7"/>
    <circle cx="67" cy="37" r="1.5" fill="#E8D1A7"/>
    <!-- Beak -->
    <polygon points="58,44 62,44 60,51" fill="#84592B"/>
    <!-- Plumage patterns -->
    <path d="M 40 75 Q 60 100 80 75" stroke="#9D9167" stroke-width="1" fill="none" opacity="0.7"/>
    <path d="M 42 90 Q 60 115 78 90" stroke="#9D9167" stroke-width="1" fill="none" opacity="0.7"/>
    <!-- Talons clutching branch -->
    <ellipse cx="48" cy="132" rx="6" ry="3" fill="#84592B"/>
    <ellipse cx="72" cy="132" rx="6" ry="3" fill="#84592B"/>
  </g>

  <!-- Hound / Dog Silhouette Howling at Empty Threshold (Chó Sủa Ma) -->
  <g transform="translate(110, 310)" opacity="0.85">
    <!-- Dog sitting, head tilted upward howling -->
    <path d="M 60 110 L 85 110 L 80 85 L 65 70 L 68 50 L 60 35 L 52 45 L 45 35 L 40 48 L 48 65 L 40 90 L 35 110 Z" fill="#1b120c" stroke="#84592B" stroke-width="1"/>
    <!-- Acoustic soundwaves representing hyper-acute hearing -->
    <path d="M 75 30 Q 90 20 105 35" stroke="#E8D1A7" stroke-width="1" fill="none" opacity="0.5" stroke-dasharray="2 3"/>
    <path d="M 85 20 Q 105 8 125 25" stroke="#E8D1A7" stroke-width="1" fill="none" opacity="0.3" stroke-dasharray="2 3"/>
  </g>

  <!-- Serpent Silhouette (Rắn bò ngang đường) -->
  <g opacity="0.75">
    <path d="M 520 410 Q 560 395 600 415 Q 640 435 680 405" stroke="#84592B" stroke-width="3" fill="none" stroke-linecap="round"/>
    <circle cx="682" cy="404" r="3.5" fill="#743014"/>
  </g>

  <!-- Seal -->
  <g transform="translate(60, 60)">
    <circle cx="35" cy="35" r="28" fill="#743014" stroke="#E8D1A7" stroke-width="1.5"/>
    <text x="35" y="32" font-family="'Cinzel Decorative', 'Georgia', serif" font-size="10" fill="#E8D1A7" text-anchor="middle" font-weight="bold">ĐIỀM</text>
    <text x="35" y="47" font-family="'Cinzel Decorative', 'Georgia', serif" font-size="10" fill="#E8D1A7" text-anchor="middle" font-weight="bold">BÁO</text>
  </g>

  <!-- Label in Antique Serif -->
  <text x="400" y="460" font-family="'Cinzel Decorative', 'Georgia', serif" font-size="14" letter-spacing="4" fill="#E8D1A7" text-anchor="middle" opacity="0.85">ANIMAL INSTINCTS &amp; COGNITIVE BIAS</text>
</svg>
