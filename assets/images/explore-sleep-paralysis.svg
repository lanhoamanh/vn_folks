<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <radialGradient id="parchmentGlow" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#E8D1A7" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#84592B" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#442D1C" stop-opacity="0.95"/>
    </radialGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" result="noise"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.91   0 0 0 0 0.82   0 0 0 0 0.65  0 0 0 0.08 0"/>
      <feComposite in2="SourceGraphic" in="gl" operator="in"/>
    </filter>
    <linearGradient id="wineGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#743014"/>
      <stop offset="100%" stop-color="#2a1208"/>
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="500" fill="#2a1b12"/>
  <rect width="800" height="500" fill="url(#parchmentGlow)"/>

  <!-- Vintage border frame -->
  <rect x="20" y="20" width="760" height="460" fill="none" stroke="#9D9167" stroke-width="1.5" stroke-dasharray="8 4" opacity="0.6"/>
  <rect x="28" y="28" width="744" height="444" fill="none" stroke="#84592B" stroke-width="0.8" opacity="0.8"/>
  
  <!-- Corner Ornaments -->
  <g stroke="#E8D1A7" stroke-width="1.2" fill="none" opacity="0.7">
    <path d="M 28 48 L 48 48 L 48 28"/>
    <path d="M 772 48 L 752 48 L 752 28"/>
    <path d="M 28 452 L 48 452 L 48 472"/>
    <path d="M 772 452 L 752 452 L 752 472"/>
    <circle cx="48" cy="48" r="3" fill="#E8D1A7"/>
    <circle cx="752" cy="48" r="3" fill="#E8D1A7"/>
    <circle cx="48" cy="452" r="3" fill="#E8D1A7"/>
    <circle cx="752" cy="452" r="3" fill="#E8D1A7"/>
  </g>

  <!-- Atmospheric Room & Bed Frame -->
  <g opacity="0.85">
    <!-- Slanted floor shadow -->
    <path d="M 100 420 L 700 420 L 640 330 L 160 330 Z" fill="#1c120c" opacity="0.7"/>
    <!-- Traditional wooden bedstead -->
    <path d="M 180 340 L 620 340 L 620 370 L 180 370 Z" fill="#442D1C" stroke="#84592B" stroke-width="2"/>
    <path d="M 180 370 L 195 420 L 210 420 L 200 370 Z" fill="#351f11"/>
    <path d="M 600 370 L 590 420 L 605 420 L 620 370 Z" fill="#351f11"/>
    <!-- Woven sleeping mat (chiếu cói) -->
    <path d="M 190 338 L 610 338 L 610 348 L 190 348 Z" fill="#9D9167" opacity="0.6"/>
  </g>

  <!-- Sleeper Silhouette -->
  <g fill="#573820" opacity="0.9">
    <!-- Head on wooden pillow -->
    <ellipse cx="260" cy="328" rx="22" ry="16" fill="#84592B"/>
    <!-- Body under thin sheet -->
    <path d="M 275 330 Q 380 300 560 335 L 560 345 L 275 345 Z" fill="#6b4628"/>
  </g>

  <!-- The "Bóng Đè" (Nocturnal Shadow Entity) -->
  <g opacity="0.92">
    <!-- Ethereal smoke/mist rising from sleeper -->
    <path d="M 330 330 Q 300 240 380 180 Q 420 140 450 110 Q 470 160 440 220 Q 400 270 410 330 Z" 
          fill="#130b07" opacity="0.85"/>
    <path d="M 380 310 Q 340 200 410 140 Q 460 90 480 140 Q 510 200 470 280 Q 450 320 430 330 Z" 
          fill="#0c0704" opacity="0.9"/>
    
    <!-- Shadow entity's crouching torso upon the sleeper's chest -->
    <ellipse cx="400" cy="270" rx="45" ry="32" fill="#130b07"/>
    <!-- Head of the shadow leaning forward -->
    <circle cx="370" cy="210" r="26" fill="#0c0704"/>
    
    <!-- Glowing faint ember eyes of the entity -->
    <circle cx="362" cy="208" r="2.5" fill="#E8D1A7" opacity="0.8"/>
    <circle cx="376" cy="209" r="2.5" fill="#E8D1A7" opacity="0.8"/>
    
    <!-- Long spectral tendril claws reaching toward sleeper's throat -->
    <path d="M 385 245 Q 360 270 330 295 Q 310 305 315 315" stroke="#130b07" stroke-width="6" stroke-linecap="round" fill="none"/>
    <path d="M 410 250 Q 425 285 415 315" stroke="#130b07" stroke-width="5" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Folk Talisman under pillow (Garlic & Knife hint) -->
  <g opacity="0.75" transform="translate(220, 360)">
    <!-- Small rustic knife blade -->
    <path d="M 0 0 L 35 8 L 0 5 Z" fill="#9D9167" stroke="#E8D1A7" stroke-width="0.8"/>
    <!-- Garlic clove outline -->
    <circle cx="45" cy="5" r="7" fill="#E8D1A7" opacity="0.7"/>
  </g>

  <!-- Distant Window with Cold Moonlight -->
  <g opacity="0.4">
    <rect x="520" y="70" width="130" height="150" fill="#151b22" stroke="#84592B" stroke-width="2"/>
    <line x1="585" y1="70" x2="585" y2="220" stroke="#84592B" stroke-width="1.5"/>
    <line x1="520" y1="145" x2="650" y2="145" stroke="#84592B" stroke-width="1.5"/>
    <!-- Crescent Moon outside window -->
    <path d="M 605 105 A 16 16 0 0 0 595 130 A 20 20 0 1 1 605 105 Z" fill="#E8D1A7" opacity="0.85"/>
  </g>

  <!-- Decorative Vietnamese Calligraphy / Manuscript Badge -->
  <g transform="translate(60, 60)">
    <circle cx="35" cy="35" r="28" fill="#743014" stroke="#E8D1A7" stroke-width="1.5"/>
    <text x="35" y="32" font-family="'Cinzel Decorative', 'Georgia', serif" font-size="11" fill="#E8D1A7" text-anchor="middle" font-weight="bold">BÓNG</text>
    <text x="35" y="47" font-family="'Cinzel Decorative', 'Georgia', serif" font-size="11" fill="#E8D1A7" text-anchor="middle" font-weight="bold">ĐÈ</text>
  </g>

  <!-- Label in Antique Serif -->
  <text x="400" y="455" font-family="'Cinzel Decorative', 'Georgia', serif" font-size="14" letter-spacing="4" fill="#E8D1A7" text-anchor="middle" opacity="0.85">PARALYSIS &amp; NOCTURNAL WEIGHT</text>
</svg>
