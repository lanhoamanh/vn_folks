<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <radialGradient id="wakeBg" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#743014" stop-opacity="0.3"/>
      <stop offset="60%" stop-color="#3d1f14" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#140a06" stop-opacity="0.95"/>
    </radialGradient>
  </defs>
  <rect width="600" height="400" fill="#140a06"/>
  <rect width="600" height="400" fill="url(#wakeBg)"/>

  <rect x="15" y="15" width="570" height="370" fill="none" stroke="#9D9167" stroke-width="1.2" stroke-dasharray="6 3" opacity="0.6"/>
  <rect x="22" y="22" width="556" height="356" fill="none" stroke="#84592B" stroke-width="0.8" opacity="0.8"/>

  <!-- Funeral Wake Room (Phòng Khâm Liệm / Giường Tang) -->
  <g transform="translate(100, 180)">
    <!-- Low Wooden Mortuary Bedstead -->
    <rect x="40" y="90" width="320" height="15" fill="#442D1C" stroke="#84592B" stroke-width="1.2"/>
    <rect x="60" y="105" width="10" height="35" fill="#2d1c12"/>
    <rect x="330" y="105" width="10" height="35" fill="#2d1c12"/>
    
    <!-- White Shroud / Straw Mat (Chiếu trắng) -->
    <rect x="50" y="86" width="300" height="6" fill="#9D9167" opacity="0.8"/>

    <!-- The Cadaver Bolting Upright in Shock -->
    <g transform="translate(100, -30)">
      <!-- Torso sitting upright at 80 degrees -->
      <path d="M 20 115 L 25 30 L 55 30 L 50 115 Z" fill="#25160d" stroke="#84592B" stroke-width="1"/>
      <!-- Head draped in white mourning cloth / veil -->
      <circle cx="40" cy="18" r="16" fill="#190e08" stroke="#84592B" stroke-width="1"/>
      <!-- Faint staring eyes -->
      <circle cx="34" cy="16" r="2" fill="#E8D1A7"/>
      <circle cx="44" cy="16" r="2" fill="#E8D1A7"/>
      <!-- Legs lying flat on bed -->
      <path d="M 50 115 L 180 115 L 180 100 L 50 100 Z" fill="#25160d"/>
    </g>

    <!-- Bronze Basin with Protective Sickle across mat (Dao trừ tà) -->
    <path d="M 120 120 Q 140 115 155 125" stroke="#E8D1A7" stroke-width="2" fill="none"/>
  </g>

  <!-- Mid-Air Silhouette of the Black Cat (Linh Miêu) Leaping Over the Bed -->
  <g transform="translate(260, 90)">
    <!-- Cat mid-leap arch -->
    <path d="M 0 50 Q 30 20 65 30 Q 90 40 105 75 Q 85 65 65 65 Q 25 70 0 50 Z" fill="#080402"/>
    <!-- Cat Head & Ears -->
    <polygon points="95,45 105,30 110,48" fill="#080402"/>
    <polygon points="105,48 115,35 120,52" fill="#080402"/>
    <circle cx="108" cy="52" r="12" fill="#080402"/>
    <!-- Piercing Amber Glow Eye -->
    <circle cx="112" cy="50" r="2.5" fill="#E8D1A7"/>
    <!-- Flying Tail -->
    <path d="M 0 50 Q -25 35 -15 15" stroke="#080402" stroke-width="4" stroke-linecap="round" fill="none"/>
    <!-- Dynamic Arc Motion Line (Electric surge) -->
    <path d="M -20 80 Q 55 -5 135 75" stroke="#E8D1A7" stroke-width="1" stroke-dasharray="4 4" fill="none" opacity="0.6"/>
  </g>

  <!-- Oil Lamp on Small Altar (Đèn dầu leo lét) -->
  <g transform="translate(450, 220)">
    <path d="M 20 50 L 30 25 L 40 50 Z" fill="#84592B"/>
    <ellipse cx="30" cy="22" rx="4" ry="7" fill="#E8D1A7"/>
    <circle cx="30" cy="20" r="2" fill="#743014"/>
  </g>

  <!-- Tag Seal -->
  <g transform="translate(45, 45)">
    <circle cx="20" cy="20" r="18" fill="#743014" stroke="#E8D1A7" stroke-width="1"/>
    <text x="20" y="24" font-family="'Cinzel Decorative', serif" font-size="10" fill="#E8D1A7" text-anchor="middle">V</text>
  </g>

  <text x="300" y="370" font-family="'Cinzel Decorative', 'Georgia', serif" font-size="13" letter-spacing="3" fill="#E8D1A7" text-anchor="middle">QUỶ NHẬP TRÀNG — CORPSE REANIMATION</text>
</svg>
