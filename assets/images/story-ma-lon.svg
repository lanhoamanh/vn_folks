<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <radialGradient id="lonBg" cx="50%" cy="65%" r="60%">
      <stop offset="0%" stop-color="#84592B" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#3b1f13" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#120a06" stop-opacity="0.95"/>
    </radialGradient>
  </defs>
  <rect width="600" height="400" fill="#120a06"/>
  <rect width="600" height="400" fill="url(#lonBg)"/>

  <rect x="15" y="15" width="570" height="370" fill="none" stroke="#9D9167" stroke-width="1.2" stroke-dasharray="6 3" opacity="0.6"/>
  <rect x="22" y="22" width="556" height="356" fill="none" stroke="#84592B" stroke-width="0.8" opacity="0.8"/>

  <!-- Sand Ground / Dirt Clearing (Bãi đất trống / Ngã ba đường) -->
  <path d="M 40 310 Q 300 270 560 310 L 560 380 L 40 380 Z" fill="#25160d"/>
  
  <!-- Chalk Inscription Circle / Ritual Boundary on Dirt -->
  <ellipse cx="300" cy="285" rx="140" ry="35" fill="none" stroke="#9D9167" stroke-width="1.2" stroke-dasharray="6 6" opacity="0.6"/>

  <!-- The Tin Can (Lon Sữa Bò) Standing on Rim & Wobbling -->
  <g transform="translate(270, 210)">
    <!-- Motion / Wobble Vibrations Lines -->
    <path d="M 10 10 Q -5 25 10 40" stroke="#E8D1A7" stroke-width="1" fill="none" opacity="0.6"/>
    <path d="M 50 10 Q 65 25 50 40" stroke="#E8D1A7" stroke-width="1" fill="none" opacity="0.6"/>

    <!-- Cylindrical Tin Can Body (Inverted condensed milk can) -->
    <path d="M 15 20 L 45 20 L 45 65 L 15 65 Z" fill="#84592B" stroke="#E8D1A7" stroke-width="1.5" transform="rotate(-8 30 40)"/>
    <ellipse cx="30" cy="20" rx="15" ry="6" fill="#9D9167" stroke="#E8D1A7" stroke-width="1" transform="rotate(-8 30 40)"/>
    <!-- Rim marks / old metal label shadow -->
    <line x1="16" y1="35" x2="44" y2="35" stroke="#442D1C" stroke-width="1.5" transform="rotate(-8 30 40)"/>
    <line x1="16" y1="50" x2="44" y2="50" stroke="#442D1C" stroke-width="1.5" transform="rotate(-8 30 40)"/>

    <!-- Three Sticks of Incense stuck into dirt beside the can -->
    <line x1="-15" y1="70" x2="-18" y2="15" stroke="#743014" stroke-width="1.8"/>
    <line x1="-10" y1="70" x2="-10" y2="10" stroke="#743014" stroke-width="1.8"/>
    <line x1="-5" y1="70" x2="-2" y2="15" stroke="#743014" stroke-width="1.8"/>
    <circle cx="-18" cy="15" r="1.5" fill="#E8D1A7"/>
    <circle cx="-10" cy="10" r="1.5" fill="#E8D1A7"/>
    <circle cx="-2" cy="15" r="1.5" fill="#E8D1A7"/>

    <!-- Lit cigarette with smoke curling -->
    <line x1="60" y1="65" x2="75" y2="60" stroke="#E8D1A7" stroke-width="2"/>
    <circle cx="75" cy="60" r="1.5" fill="#743014"/>
    <path d="M 75 60 Q 85 45 78 30 Q 70 15 85 5" stroke="#E8D1A7" stroke-width="1" fill="none" opacity="0.6"/>
  </g>

  <!-- Fleeing Running Youth Silhouettes in Deep Background (Adrenaline of the chase) -->
  <g opacity="0.4" transform="translate(120, 190) scale(0.7)">
    <circle cx="40" cy="20" r="7" fill="#84592B"/>
    <path d="M 40 28 L 35 55 L 20 80 M 35 55 L 50 80 M 40 38 L 20 45 M 40 38 L 60 30" stroke="#84592B" stroke-width="3" fill="none"/>
  </g>

  <!-- Tag Seal -->
  <g transform="translate(45, 45)">
    <circle cx="20" cy="20" r="18" fill="#743014" stroke="#E8D1A7" stroke-width="1"/>
    <text x="20" y="24" font-family="'Cinzel Decorative', serif" font-size="10" fill="#E8D1A7" text-anchor="middle">III</text>
  </g>

  <text x="300" y="370" font-family="'Cinzel Decorative', 'Georgia', serif" font-size="13" letter-spacing="3" fill="#E8D1A7" text-anchor="middle">MA LON — ROLLING CAN DIVINATION</text>
</svg>
