<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <radialGradient id="waterBg" cx="50%" cy="65%" r="65%">
      <stop offset="0%" stop-color="#442D1C" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#1e241c" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#0a100c" stop-opacity="0.95"/>
    </radialGradient>
    <linearGradient id="riverGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1c2b20"/>
      <stop offset="100%" stop-color="#0b130e"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="#0a100c"/>
  <rect width="600" height="400" fill="url(#waterBg)"/>

  <rect x="15" y="15" width="570" height="370" fill="none" stroke="#9D9167" stroke-width="1.2" stroke-dasharray="6 3" opacity="0.6"/>
  <rect x="22" y="22" width="556" height="356" fill="none" stroke="#84592B" stroke-width="0.8" opacity="0.8"/>

  <!-- Murky River Surface & Submerged Whirlpool (Vực Nước Sâu / Vòng Xoáy) -->
  <path d="M 30 220 Q 180 180 320 210 Q 460 240 570 200 L 570 380 L 30 380 Z" fill="url(#riverGrad)"/>

  <!-- River Whirlpool Vortex (Xoáy Nước Thế Mạng) -->
  <g stroke="#9D9167" stroke-width="1.2" fill="none" opacity="0.55">
    <ellipse cx="300" cy="270" rx="160" ry="40" stroke-dasharray="8 6"/>
    <ellipse cx="300" cy="275" rx="110" ry="28" stroke-dasharray="6 4"/>
    <ellipse cx="300" cy="278" rx="60" ry="16" stroke-dasharray="4 3"/>
  </g>

  <!-- Tangled Submerged Water Hyacinths & River Reeds (Bèo Tây & Rong Rêu) -->
  <g stroke="#3d4a36" stroke-width="2" fill="none" opacity="0.8">
    <path d="M 50 380 Q 80 280 60 210 Q 70 190 85 220"/>
    <path d="M 90 380 Q 120 300 110 230"/>
    <path d="M 510 380 Q 490 280 520 220"/>
    <path d="M 540 380 Q 530 310 550 240"/>
  </g>

  <!-- Pale, Spectral Hand & Forearm Reaching Upward from the Depths -->
  <g transform="translate(260, 160)" opacity="0.9">
    <!-- Forearm breaking the water surface -->
    <path d="M 25 120 L 32 60 L 48 58 L 52 120 Z" fill="#9D9167" opacity="0.8" stroke="#E8D1A7" stroke-width="1"/>
    
    <!-- Pale Slender Palm & Splayed Fingers Reaching for a Swimmer's Ankle -->
    <path d="M 32 60 L 25 25 Q 26 15 32 18 L 38 45" stroke="#E8D1A7" stroke-width="2.5" stroke-linecap="round" fill="#84592B"/>
    <path d="M 38 45 L 38 10 Q 42 5 46 10 L 45 45" stroke="#E8D1A7" stroke-width="2.5" stroke-linecap="round" fill="#84592B"/>
    <path d="M 45 45 L 52 14 Q 56 10 60 15 L 53 48" stroke="#E8D1A7" stroke-width="2.5" stroke-linecap="round" fill="#84592B"/>
    <path d="M 53 48 L 65 25 Q 70 25 68 32 L 57 58" stroke="#E8D1A7" stroke-width="2.5" stroke-linecap="round" fill="#84592B"/>
    <!-- Water droplet rings around emerging wrist -->
    <ellipse cx="40" cy="85" rx="35" ry="10" fill="none" stroke="#E8D1A7" stroke-width="1.2" opacity="0.6"/>
  </g>

  <!-- Cold Ominous Moonlight on Water -->
  <path d="M 290 190 Q 300 210 310 190" stroke="#E8D1A7" stroke-width="2" fill="none" opacity="0.8"/>
  <circle cx="440" cy="90" r="30" fill="#E8D1A7" opacity="0.25"/>

  <!-- Tag Seal -->
  <g transform="translate(45, 45)">
    <circle cx="20" cy="20" r="18" fill="#743014" stroke="#E8D1A7" stroke-width="1"/>
    <text x="20" y="24" font-family="'Cinzel Decorative', serif" font-size="10" fill="#E8D1A7" text-anchor="middle">VII</text>
  </g>

  <text x="300" y="370" font-family="'Cinzel Decorative', 'Georgia', serif" font-size="13" letter-spacing="3" fill="#E8D1A7" text-anchor="middle">MA DA — RESTLESS WATER GHOST</text>
</svg>
