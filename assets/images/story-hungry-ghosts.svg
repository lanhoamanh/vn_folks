<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <radialGradient id="ghostBg" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#743014" stop-opacity="0.3"/>
      <stop offset="60%" stop-color="#3d1e11" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#140b07" stop-opacity="0.95"/>
    </radialGradient>
  </defs>
  <rect width="600" height="400" fill="#140b07"/>
  <rect width="600" height="400" fill="url(#ghostBg)"/>

  <rect x="15" y="15" width="570" height="370" fill="none" stroke="#9D9167" stroke-width="1.2" stroke-dasharray="6 3" opacity="0.6"/>
  <rect x="22" y="22" width="556" height="356" fill="none" stroke="#84592B" stroke-width="0.8" opacity="0.8"/>

  <!-- Ancient Crossroad with Incense Urn & Offerings -->
  <g transform="translate(180, 220)">
    <!-- Small rustic brick shrine / roadside altar -->
    <path d="M 50 80 L 190 80 L 175 120 L 65 120 Z" fill="#2d1c12" stroke="#84592B" stroke-width="1.5"/>
    <!-- Bowls of thin rice porridge (cháo trắng) -->
    <ellipse cx="85" cy="78" rx="15" ry="6" fill="#9D9167" stroke="#E8D1A7" stroke-width="0.8"/>
    <ellipse cx="155" cy="78" rx="15" ry="6" fill="#9D9167" stroke="#E8D1A7" stroke-width="0.8"/>
    <!-- Incense pot with rising red ember sticks -->
    <path d="M 112 78 L 115 62 L 125 62 L 128 78 Z" fill="#743014" stroke="#E8D1A7" stroke-width="1"/>
    <line x1="117" y1="62" x2="114" y2="25" stroke="#E8D1A7" stroke-width="1.8"/>
    <line x1="120" y1="62" x2="120" y2="20" stroke="#E8D1A7" stroke-width="1.8"/>
    <line x1="123" y1="62" x2="126" y2="25" stroke="#E8D1A7" stroke-width="1.8"/>
    <circle cx="114" cy="25" r="1.5" fill="#E8D1A7"/>
    <circle cx="120" cy="20" r="1.5" fill="#E8D1A7"/>
    <circle cx="126" cy="25" r="1.5" fill="#E8D1A7"/>
  </g>

  <!-- Wandering Spectral Figures (Cô Hồn) Reaching Toward the Altar -->
  <g opacity="0.85">
    <!-- Spectral Figure Left -->
    <path d="M 90 280 Q 120 180 150 140 Q 160 110 150 90 Q 140 110 130 140 Q 110 200 70 280 Z" fill="#1b120c"/>
    <circle cx="150" cy="85" r="10" fill="#1b120c"/>
    <!-- Thin arm reaching toward bowl -->
    <path d="M 140 140 Q 180 160 210 210" stroke="#84592B" stroke-width="2" fill="none" opacity="0.7"/>

    <!-- Spectral Figure Right (Tormented needle-thin neck) -->
    <path d="M 510 280 Q 480 180 440 130 Q 430 100 440 80 Q 450 100 460 130 Q 480 200 530 280 Z" fill="#1b120c"/>
    <circle cx="435" cy="75" r="9" fill="#1b120c"/>
    <path d="M 445 130 Q 410 160 380 210" stroke="#84592B" stroke-width="2" fill="none" opacity="0.7"/>
  </g>

  <!-- Swirling Votive Paper Ash in Night Sky (Tàn Vàng Mã) -->
  <g fill="#E8D1A7" opacity="0.5">
    <ellipse cx="280" cy="110" rx="3" ry="1.5" transform="rotate(25 280 110)"/>
    <ellipse cx="320" cy="80" rx="4" ry="2" transform="rotate(-30 320 80)"/>
    <ellipse cx="350" cy="130" rx="3" ry="1" transform="rotate(15 350 130)"/>
    <ellipse cx="240" cy="150" rx="4" ry="1.8" transform="rotate(45 240 150)"/>
  </g>

  <!-- Tag Seal -->
  <g transform="translate(45, 45)">
    <circle cx="20" cy="20" r="18" fill="#743014" stroke="#E8D1A7" stroke-width="1"/>
    <text x="20" y="24" font-family="'Cinzel Decorative', serif" font-size="10" fill="#E8D1A7" text-anchor="middle">II</text>
  </g>

  <text x="300" y="370" font-family="'Cinzel Decorative', 'Georgia', serif" font-size="13" letter-spacing="3" fill="#E8D1A7" text-anchor="middle">HUNGRY GHOSTS &amp; WANDERING SOULS</text>
</svg>
