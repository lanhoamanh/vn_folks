<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <radialGradient id="celestialBronze" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#E8D1A7" stop-opacity="0.3"/>
      <stop offset="45%" stop-color="#84592B" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#18130e" stop-opacity="0.95"/>
    </radialGradient>
  </defs>

  <rect width="800" height="500" fill="#18130e"/>
  <rect width="800" height="500" fill="url(#celestialBronze)"/>

  <!-- Vintage border frame -->
  <rect x="20" y="20" width="760" height="460" fill="none" stroke="#9D9167" stroke-width="1.5" stroke-dasharray="8 4" opacity="0.6"/>
  <rect x="28" y="28" width="744" height="444" fill="none" stroke="#84592B" stroke-width="0.8" opacity="0.8"/>

  <!-- Corner Ornaments -->
  <g stroke="#E8D1A7" stroke-width="1.2" fill="none" opacity="0.7">
    <path d="M 28 48 L 48 48 L 48 28"/>
    <path d="M 772 48 L 752 48 L 752 28"/>
    <path d="M 28 452 L 48 452 L 48 472"/>
    <path d="M 772 452 L 752 452 L 752 472"/>
    <circle cx="48" cy="48" r="3" fill="#E8D1A7"/>
    <circle cx="752" cy="48" r="3" fill="#E8D1A7"/>
    <circle cx="48" cy="452" r="3" fill="#E8D1A7"/>
    <circle cx="752" cy="452" r="3" fill="#E8D1A7"/>
  </g>

  <!-- Giant Đông Sơn Bronze Drum Solar Starburst Mandala in Center -->
  <g transform="translate(400, 230)" opacity="0.85">
    <!-- Concentric Bronze Drum Rings -->
    <circle cx="0" cy="0" r="160" fill="none" stroke="#84592B" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="145" fill="none" stroke="#9D9167" stroke-width="0.8" stroke-dasharray="4 4"/>
    <circle cx="0" cy="0" r="120" fill="none" stroke="#84592B" stroke-width="1"/>
    <circle cx="0" cy="0" r="85" fill="none" stroke="#9D9167" stroke-width="1.2"/>
    <circle cx="0" cy="0" r="50" fill="none" stroke="#84592B" stroke-width="1"/>
    <circle cx="0" cy="0" r="15" fill="#E8D1A7"/>

    <!-- 14-Pointed Solar Starburst (Mặt Trời Trống Đồng) -->
    <g fill="#E8D1A7" opacity="0.85">
      <!-- 14 Rays radiating from center -->
      <polygon points="0,-48 4,-18 -4,-18"/>
      <polygon points="0,48 4,18 -4,18"/>
      <polygon points="-48,0 -18,4 -18,-4"/>
      <polygon points="48,0 18,4 18,-4"/>
      <polygon points="34,34 16,10 10,16"/>
      <polygon points="-34,-34 -16,-10 -10,-16"/>
      <polygon points="34,-34 16,-10 10,-16"/>
      <polygon points="-34,34 -16,10 -10,16"/>
      <polygon points="21,43 13,14 7,17"/>
      <polygon points="-21,-43 -13,-14 -7,-17"/>
      <polygon points="43,21 14,13 17,7"/>
      <polygon points="-43,-21 -14,-13 -17,-7"/>
      <polygon points="43,-21 14,-13 17,-7"/>
      <polygon points="-43,21 -14,13 -17,7"/>
    </g>

    <!-- Flying Cranes (Chim Lạc) flying counter-clockwise -->
    <g stroke="#9D9167" stroke-width="1.2" fill="none" opacity="0.75">
      <!-- Crane 1 Top -->
      <path d="M -60 -130 Q -40 -145 -10 -135 Q 10 -140 30 -130"/>
      <!-- Crane 2 Right -->
      <path d="M 130 -60 Q 145 -40 135 -10 Q 140 10 130 30"/>
      <!-- Crane 3 Bottom -->
      <path d="M 60 130 Q 40 145 10 135 Q -10 140 -30 130"/>
      <!-- Crane 4 Left -->
      <path d="M -130 60 Q -145 40 -135 10 Q -140 -10 -130 -30"/>
    </g>
  </g>

  <!-- Celestial Figures: Goddess of Sun (Mặt Trời) & Goddess of Moon (Mặt Trăng) Palanquins -->
  <g opacity="0.75">
    <!-- Sun Deity Palanquin Left -->
    <g transform="translate(130, 110)">
      <circle cx="40" cy="40" r="28" fill="#743014" stroke="#E8D1A7" stroke-width="1.5"/>
      <circle cx="40" cy="40" r="14" fill="#E8D1A7"/>
      <line x1="0" y1="55" x2="80" y2="55" stroke="#84592B" stroke-width="2"/> <!-- carrying pole -->
      <text x="40" y="80" font-family="'Cinzel Decorative', serif" font-size="9" fill="#E8D1A7" text-anchor="middle">NỮ THẦN MẶT TRỜI</text>
    </g>

    <!-- Moon Deity Palanquin Right -->
    <g transform="translate(590, 110)">
      <circle cx="40" cy="40" r="28" fill="#442D1C" stroke="#9D9167" stroke-width="1.5"/>
      <path d="M 45 25 A 14 14 0 0 0 35 50 A 18 18 0 1 1 45 25 Z" fill="#E8D1A7"/>
      <line x1="0" y1="55" x2="80" y2="55" stroke="#84592B" stroke-width="2"/>
      <text x="40" y="80" font-family="'Cinzel Decorative', serif" font-size="9" fill="#E8D1A7" text-anchor="middle">NỮ THẦN MẶT TRĂNG</text>
    </g>
  </g>

  <!-- Magpie Bridge (Cầu Ô Thước) & Silver River (Dải Ngân Hà) across bottom -->
  <g opacity="0.6">
    <!-- Wavy celestial river -->
    <path d="M 60 380 Q 220 340 400 370 Q 580 400 740 360" stroke="#9D9167" stroke-width="1.5" stroke-dasharray="3 5" fill="none"/>
    <text x="400" y="395" font-family="'EB Garamond', serif" font-size="11" font-style="italic" fill="#E8D1A7" text-anchor="middle" opacity="0.8">The Magpie Bridge (Cầu Ô Thước) &amp; Seasonal Monsoon Rains</text>
  </g>

  <!-- Seal -->
  <g transform="translate(60, 60)">
    <circle cx="35" cy="35" r="28" fill="#743014" stroke="#E8D1A7" stroke-width="1.5"/>
    <text x="35" y="32" font-family="'Cinzel Decorative', 'Georgia', serif" font-size="9" fill="#E8D1A7" text-anchor="middle" font-weight="bold">THIÊN</text>
    <text x="35" y="47" font-family="'Cinzel Decorative', 'Georgia', serif" font-size="9" fill="#E8D1A7" text-anchor="middle" font-weight="bold">VĂN</text>
  </g>

  <!-- Label in Antique Serif -->
  <text x="400" y="460" font-family="'Cinzel Decorative', 'Georgia', serif" font-size="14" letter-spacing="4" fill="#E8D1A7" text-anchor="middle" opacity="0.85">BRONZE AGE ASTRONOMY &amp; MONSOON MYTHS</text>
</svg>
