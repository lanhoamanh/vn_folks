<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#84592B" stop-opacity="0.25"/>
      <stop offset="70%" stop-color="#442D1C" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#19100a" stop-opacity="0.95"/>
    </radialGradient>
  </defs>
  <rect width="600" height="400" fill="#19100a"/>
  <rect width="600" height="400" fill="url(#bgGlow)"/>
  
  <rect x="15" y="15" width="570" height="370" fill="none" stroke="#9D9167" stroke-width="1.2" stroke-dasharray="6 3" opacity="0.6"/>
  <rect x="22" y="22" width="556" height="356" fill="none" stroke="#84592B" stroke-width="0.8" opacity="0.8"/>

  <!-- Moon in mist -->
  <circle cx="450" cy="110" r="45" fill="#E8D1A7" opacity="0.3"/>
  <circle cx="450" cy="110" r="28" fill="#E8D1A7" opacity="0.7"/>

  <!-- Mysterious Bamboo Path at Dusk -->
  <g stroke="#352417" stroke-width="2" opacity="0.7">
    <line x1="80" y1="400" x2="60" y2="120"/>
    <line x1="100" y1="400" x2="85" y2="100"/>
    <line x1="500" y1="400" x2="520" y2="130"/>
    <line x1="530" y1="400" x2="550" y2="110"/>
  </g>

  <!-- Ông Ba Bị Silhouette (Towering Figure with Three Woven Sacks) -->
  <g transform="translate(230, 80)" opacity="0.92">
    <!-- Huge Woven Sack 1 (Left shoulder) -->
    <ellipse cx="20" cy="120" rx="42" ry="50" fill="#2d1c12" stroke="#84592B" stroke-width="1.5"/>
    <!-- Sack crosshatch weave -->
    <path d="M -10 90 L 50 150 M -10 120 L 50 180 M 50 90 L -10 150 M 50 120 L -10 180" stroke="#84592B" stroke-width="0.8" opacity="0.6"/>
    
    <!-- Huge Woven Sack 2 (Right shoulder) -->
    <ellipse cx="120" cy="115" rx="44" ry="52" fill="#2d1c12" stroke="#84592B" stroke-width="1.5"/>
    <path d="M 90 85 L 150 145 M 90 115 L 150 175 M 150 85 L 90 145 M 150 115 L 90 175" stroke="#84592B" stroke-width="0.8" opacity="0.6"/>

    <!-- Central Third Sack (Back) -->
    <ellipse cx="70" cy="90" rx="38" ry="46" fill="#1b110a" stroke="#84592B" stroke-width="1.5"/>

    <!-- Figure's Head & Face (Cryptic expression / hood) -->
    <path d="M 50 30 Q 70 15 90 30 Q 95 60 70 70 Q 45 60 50 30 Z" fill="#1b110a" stroke="#84592B" stroke-width="1.2"/>
    <!-- Eyes (Gleaming in darkness) -->
    <circle cx="62" cy="42" r="2.5" fill="#E8D1A7"/>
    <circle cx="78" cy="42" r="2.5" fill="#E8D1A7"/>

    <!-- Massive Cloaked Body -->
    <path d="M 25 140 L 5 260 L 135 260 L 115 140 Z" fill="#140c07"/>
    <!-- Rope Ties (Quai bị) -->
    <path d="M 30 70 Q 70 120 110 70" stroke="#E8D1A7" stroke-width="1.5" fill="none"/>
    <path d="M 20 110 Q 70 160 120 110" stroke="#E8D1A7" stroke-width="1.2" fill="none"/>
  </g>

  <!-- Tag Seal -->
  <g transform="translate(45, 45)">
    <circle cx="20" cy="20" r="18" fill="#743014" stroke="#E8D1A7" stroke-width="1"/>
    <text x="20" y="24" font-family="'Cinzel Decorative', serif" font-size="10" fill="#E8D1A7" text-anchor="middle">I</text>
  </g>

  <text x="300" y="370" font-family="'Cinzel Decorative', 'Georgia', serif" font-size="13" letter-spacing="3" fill="#E8D1A7" text-anchor="middle">ÔNG BA BỊ — THE THREE-SACKED MAN</text>
</svg>
